body:
  text: 兩漢刋誤補遺卷九宋吳仁傑撰字誤光武紀深略緯文仁傑按文選作緯天恐當從文選為是又馮衍傳周宣齊威猶有申伯召虎夷吾吉甫注吉甫謂尹吉甫按吉甫當作成父謂王子成父也若尹吉甫不應序于夷吾之下又黃瓊傅忠臣懼死而杜口萬夫怖禍而木舌注引法言金口木舌按金口木舌木鐸也所以振文事語意不類疑木當作束楚漢春秋人銜枚馬束舌李尋曰智者結舌顔注謂不敢出言也又西羌傳元元無妄之災當作元二案元二别見鄧隲傳舊注云即元元洪邁容齊隨筆詳辨其非謂是永初元年二年此云西羌傳之元元當作元二不復有所引證今考是傳乃永建四年追數二十年前事正在永初元年二年與鄧隲傳元二之文符合戊巳一明紀北胸奴及車師後王圍戊己校尉耿恭刊誤曰檢詳耿恭傅恭作戊校此不合有已字仁傑按顔氏注百官表曰有戊校尉己校尉其究不然屯田始直校尉領護田卒但以屯田校尉為稱後乃為戊己校尉表初不言有戊校己校兩官遍考前書紀傳亦無有為戊校尉己校尉者如徐普刁護郭欽皆兼戊己為官稱獨烏孫傳云徙已校屯烏墨顔注有戊己兩校兵此直徙己校以理撥之是特兵有戊校己校之分尉則兼戊己為官稱也顔亦知己校為兵而云兩尉者殆見後書西域傳序言元帝置戊己二校尉遂為此說而范亦以後漢有戊校尉因謂元帝所置為二尉耳其實兩都設官之制不同先漢有戊校己校兵而尉之官稱則兼戊己後漢有戊己校尉戊校尉而各以校兵為名其可以此而律彼哉戊己二耿恭傳恭為戊己校尉屯後王部金蒲城關寵為戊己校尉屯前王柳中城刊誤曰戊己本是兩校故恭寵各為一校以理觀之恭是戊校寵是己校也仁傑按東都凡兩置戊己校尉永平十七年恭寵皆為戊己校尉者以此兩人各將戊校己校兵故也永元三年復置戊己校尉將兩校兵如故又置戊校尉則以所將止戊校兵耳戊己校尉自恭寵之後有任尚索頵戊己司馬有曹寬凡紀傳言戊己校尉無慮十數竝同一辭惟車師後王傳載戊部候嚴皓戊校尉閻詳後書言戊校尉者獨此一事其屬又有後部司馬章懷太子注云司馬即屬戊校尉所統和帝時置戊校尉鎮車師後部是也且戊校尉永元所置刊誤謂但和帝以後事云戊己校尉者皆多己字猶之可也若恭寵為校尉自在孝明世乃曰恭作戊校此不合有己字豈别有據耶戊己三明紀初置戊己校尉注戊己中央也鎮服四方又西域傳注開渠播種以為厭勝故稱戊己前書顔注其說尤煩竟不甚了王彥賓云戊己土也屯田以耕土為事故取為名仁傑按馬融傳校隊按部前後有屯甲乙相伍戊己為堅注謂戊己居中為中堅也詩曰中田有廬蘇黃門謂田中有廬以便田事二校之設自兵屯言之則以其為中堅而命名可也然二校之外乃無所謂甲乙諸屯則其命名之意殆如詩所云取其居屯田之中以便田事而已斷獄斷獄得情號居前代十二章懷太子注十斷其二言少刑也仁傑按前書刑法志自建武永平朝無威福之臣邑無豪傑之俠以口率計斷獄少於成哀之間什八可謂清矣范氏所謂前代即成哀之間注不指此而泛言之未之盡也河清一桓紀案是書避宋欽宗諱凡桓字皆作威今依史文改正延熹八年濟隂東郡濟北河水清襄楷上疏曰按古帝王未有河清者也清者屬陽濁者屬隂當濁而反清者隂欲為陽也豈諸侯有規京都計耶仁傑曰楷言良有理蓋臣者君之隂諸侯者天子之隂后妃為人主之隂夷狄為中國之隂觀延熹以後凡有河清之異非國有大故下人謀叛則后妃預政夷狄亂華也後漢及隋唐五行志載河清事指為災異漢隋二史又皆著其事應其說自楷發之河清二京房易傳河水清天下平故鮑照張暢皆有河清頌後齊至以此紀元而近世中外表賀蓋以為不可逢之嘉瑞也孔毅父論祥瑞不可憑引代宗河清幸陜事以證要之河清本非祥瑞事往時編會要者分别部居乃列之休徵門中案是書諱宋仁宗嫌名凡徴字皆作證今依經文改正豈偶未之思歟獨襄楷推原咎徴固善但恨其猶惑易傳之說以春秋書麟為比云河清三漢以來河清而史不著事應者皆可推言之也建寧四年河水清鮮卑寇荆州宋元嘉二十四年河濟俱清後三年魏人至瓜步唐武德九年河清建成兄弟自相魚肉貞觀十四年以後比三年河清劉蘭齊王張亮相繼以畔誅二十三年河清有國恤永徽調露間河清者四則應在武氏開元中河清則應在祿山乾元二年河清不三年有國恤寶應元年河清明年代宗幸陜建中四年河清涇原兵變十四年河清李錡以不軌聞其為不祥甚矣五日一禮儀志以五月五日朱索五色印為門户飾仁傑按五當作午郎顗曰宜以五月丙午遣大尉論衡亦曰以五月丙午日日中之時鑄陽燧謂丙日或午日也顗充皆當時人其言宜可據則以索印飾門户必仲夏午日也世俗訛傳遂用五日白傅樂府百鍊鏡篇謂其鑄以五月五日午時此蓋依倣鑄陽燧之法然以為五日則誤矣周處風土記仲夏端午烹鶩進角黍注云端始也蓋以五月如遇午日為端午如三月如遇巳日為上巳耳近世角黍不用午日而但用五月五日然猶謂之端午如魏晉以來祓禊不用巳日而但用三月三日謂之上巳也二事正相類或謂本草采藥多用五月五日恐自有所本斯又不然朝伯宇談助載祕要辟兵法用正月上寅日取木觸類推之本草亦誤也五日二資暇録端午謂五月五日也今人多書午字其義無取濟翁家有元和中端五詔書竝無作午字處容齊隨筆謂明皇以八月五日生張說上大衍厯序云謹以八月端午獻之宋璟表亦云月惟仲秋日在端午然則凡月之五日皆可稱端午仁傑按周官壺涿氏午貫象齒鄭氏注午故書為五王彥賓謂午五通用按五月當作端午八月當作端五今元和詔書與張宋二公序表所用字正爾相反以五午通用言之則可若論本指未免失之臘禮儀志季冬之月星回歲終隂陽以交勞農大享臘仁傑按前書陳勝傳臘月勝之汝隂索隱曰臘節在十二月故謂之臘月許氏說文云冬至後三戌為臘蓋以漢火行言之本朝亦以火王故戌臘與漢同然用三戌為定若冬至在朔翌日而遇戌則三戌在十一月矣若冬至在晦是日而遇亥子則三戌在正月矣非所謂星回歲終隂陽之交也且以十一月正月而謂為臘月可乎謂宜母以三戌為拘或二戌或三戌或四戌要使臘常不出季冬之月如是而已儺呼大儺選百二十人為侲子嚾呼仁傑按淮南書舉大木者前呼邪許後者應之蓋衆聲和呼之義故漢制大儺嚾呼而後世謂之邪呼南史曹景宗臘月于宅中使人作邪呼逐除遍往人家是也近時小說乃作打夜狐不知邪呼自有本字許嵩謂俗呼野雩及野胡亦誤也牟牟八歐陽公詩本義云牟者百穀中一穀孟子言牟又言麥明非一物若謂來牟為麥則非爾牟既不為麥而於爾雅亦無他訓詁旁考六經牟無義訓多是人名地名仁傑按詩美后稷即有邰家室張敞傳后稷封於斄師古曰斄與邰同然則來牟之來即斄之省文耳牟訓麥之外又為器名故志以牟與豆籩偕言之內則亦云敦牟巵匜注云敦牟黍稷器也思文之詩貽我來牟帝命率育蓋言帝賜黍稷之器使后稷祈穀以均養四方之民與生民詩所詠于豆于登義同臣工詩言於皇來牟終之以迄用豐年所以歌詠祈穀之應也然則所謂來牟者指言后稷初封所賜祭器詩文從省而毛鄭乃有赤鳥牟麥俱來之誕宜為歐陽公所不取升服小紅十一升仁傑按義禮大功布九升小功布十一升鄭康成曰八十縷為一升司馬公禮書云古者五服皆用布以升數為别其經以八十縷為一升蓋當時有織此布以供喪用者布之不論升數久矣呂氏鄉儀亦云今布無升數且隨精粗以意定之仁傑謂今布不可謂無升數特語轉為知陵切耳鄭謂升當作登登成也而知陵切亦訓為成今織具曰簆者每簆用六成七成多至十五成以上以成之多少為布之精粗大率四十齒為一成而兩縷共一齒正合康成之說粗者齒才用一縷則是六成實三成耳士夕禮言衰三升亦與此合中候竇憲傳發北軍五校注云漢有南北軍中候刋誤曰漢有北軍中候衍南字仁傑曰凡軍皆有候比軍總于中尉故其候曰中候張蒼任人為中候是也其後中尉更名執金吾則中候之官亦隨之而改始元中有執金吾候陳茂是也南軍總于衛尉其候官自名衛候安得有中候耶刋誤言是也又孔融傳拜中軍候刊誤曰漢官無中軍候惟有北軍中候耳字有脫誤仁傑按郭仲竒碑額云北軍中候祝睦碑云北軍軍中候然仲竒碑中但云拜軍中候不言北軍與額不同郭究碑亦但以軍中稱之者蓋當時官稱所尚如此北海傳當云軍中候其文倒耳無脫字也中候自中興以來始有北軍軍中候之稱其辭或省則曰北軍中候軍中候云貫脛馬援傳中矢貫脛東觀漢記作矢貫腓脹仁傑按莊周書腓無胈脛無毛急就章股腳膝臏脛為柱􅀈踝跟踵相近聚顔師古注脛胻骨也􅀈腓脹也然則脛與腓脹相近而不同援之中矢實貫腓脹書貫脛則乖其實矣又腓脹亦謂之䏿山海經無䏿之國䏿或作綮郭注曰綮腓脹也莊周書技經肯綮之未嘗集韻以綮為筋肉結處不言與䏿通蓋偶忘山海經注歲龍一張純傳攝提之歲倉龍甲寅仁傑按龍名有三左傳龍見而雩此謂東方七宿為蒼龍之象又曰蛇乘龍此謂歲星木精木為蒼龍故歲星亦以龍名又淮南書以青龍為天神之貴青龍即太歲異名王莽銅權銘歲在大梁龍集戊辰者以歲為歲星龍為太歲也魏文昌殿鍾虞銘歲在丙申龍次大火則是以歲為太歲龍為歲星與前說相反然義得兩通至純傅所云按是年太歲在寅故言攝提之歲然又云倉龍甲寅則是龍與歲疊指太歲而言駁矣歲龍二倉龍甲寅德在東宮仁傑曰此以歲在寅與甲相值甲位在東方故也王莽傳亦云倉龍癸酉德在中宮注云癸德在中宮按杜欽言戊土中宮之部今癸北宮而云中宮者以癸為戊妃耳此與純傳小異莽傳又云今年刑在東方是歲壬申申刑寅故也歐陽公集古録載隋李康碑云歲在亥大將軍在酉公謂出於隂陽家前史所未見按此即張晏所謂歲後一辰為太隂者也抱朴書有諾臯太隂將軍之稱碑用其說塗山滕撫傳徐鳯築城于當塗山中注曰今宣州當塗縣山蘇鶚演義云塗山有四一者㑹稽二者渝州三者濠州四者嵞山國禹娶之塗山今宣州當塗縣也仁傑按書正義娶于塗山引左傳解云塗山在壽春縣則禹娶塗山非宣之當塗縣隸太平州按圖經無所謂塗山者則四塗山之說亦自不審范蔚宗自于郡國志當塗注云徐鳯反于此章懷太子不悟何也蘇文忠公濠州七絶有塗山詩云樵蘇已入黃能廟鳥鵲猶朝禹㑹村自注云下有禹廟山前有禹㑹村當塗荀淑傳再遷當塗長注曰縣在今宣州仁傑按有兩當塗縣一在九江郡一在宣州九江之當塗以塗山得名故城在唐屬濠州是也宣之當塗則晉成帝時以當塗縣流人過江在于湖者僑立為當塗縣隋大業十年屬宣州是也宣之當塗晉成帝始置東都固未之有滕撫傳注亦同斯誤獨下邳惠王傳注謂當塗在今濠州鍾離縣西南則亦知其處矣顧于兩傳云然所未喻也兩漢刊誤補遺卷九
