body:
  text: 兩漢刊誤補遺目録正史類卷一沛豐邑中姓劉氏祭蚩尤剛武侯之字闕文衍文塞翟五諸侯一五諸侯二東西尚右一尚右二尚右三義年灌嬰守滎陽吕氏南北軍一南北軍二南北軍三南北軍四南北軍五卷二督之年號作誥飛廉後元一後元二馬口錢大赦池籞粲神爵元年甘露一甘露二黃龍元年三服官休侯一休侯二申徒一申徒二卷三前元年一前元年二前元年三前三年搏掩亞谷相國御史丞史騪粟京兆張廷尉一張廷尉二山都侯一山都侯二元愷一元愷二元愷三羲和一羲和二羲和三羲和四羲和五卷四柏封羿奡太顚五則既生霸一既生霸二既生霸三方明樂師方丘房中歌富媪媪神銚阡伯甽壟上夀一上夀二南嶽昆侖卷五封禪太歲一太歲二太歲三咸池一咸池二戎叔魏舒三虢一三虢二三虢三三虢四仲雍虞仲北吳吳城三江一三江二北景輯太學卷六史書令史易之嗛嗛將尉血食蒲將軍一蒲將軍二五領趙相國八佾得獸頤指亡何姑姊子子姓角丹水蒼梧曼姬孫衛卷七騶虞一騶虞二騶虞三鷫一鷫二太史公一太史公二太史公三太史公四太史公五麟止奏疏王良筳哀鰥夷齊滿籯終王封事二誤太隂子卯東西鄉卷八醖藉異姓反騷鋭一鋭二冘與頷頤答北海錐刀黃金鐵器亂曰奴戮二奴戮二歲星禡二禡二卷九字誤戊己二戊己二戊己三斷獄河清一河清二河清三五日一五日二臘儺呼牟升中候貫脛歲龍一歲龍二塗山當塗卷十符一符二諷從士黃老君楊氏公輸班偃伯咸恆鳥獸要子菴畫諾于越牙門一牙門二牙門三胎息郎君使胸奴臣等謹案兩漢刊誤補遺宋吳仁傑撰仁傑字斗南一字南英别號蠧隱居士崑山人其稱河南者舉郡望也淳熙中登進士官國子學録是書前有淳熙己酉曽絳序稱仁傑知羅田縣時自刋板又卷末有慶元己未林瀛跋稱陳虔英為刋於全州郡齋殆初欲刋而未果抑虔英又重刊歟舊刻久佚此本乃朱彞尊之子昆田抄自山東李開先家因傳於世據其標題當為劉攽兩漢書刋誤而作而書中乃兼補正劉敞劉奉世之説考趙希辨讀書附志載西漢刊誤一卷稱劉攽撰文獻通考載東漢刋誤一卷引讀書志之文亦稱劉攽撰又載三劉漢書標注六卷引讀書志之文稱劉敞劉攽劉奉世同撰又引陳振孫書録解題稱别本題公非先生刋誤其實一書徐度郤掃編引邠所校陳勝田橫傳二條稱其兄敞及兄子奉世皆精於漢書每讀隨所得釋之後成一編號三劉漢書以是數説推之蓋攽於前後漢書初各為刊誤一卷趙希辨所記是也後以攽所校漢書與敞父子所校合為一編徐度所記是也然當時乃以攽書合於敞父子書非以敞父子書合於攽書故不改敞父子漢書標注之名而東漢一卷無所附麗仍為别行則馬端臨所記是也至别本乃以攽書為主而敞奉世説附入之故仍題刊誤之名則陳振孫所記是也厥後遂以東漢刊誤併附以行而兩漢刊誤名焉仁傑之兼補三劉蓋據後來之本而其名則未及改也文獻通考載是書十七卷宋史藝文志則作十卷今考其書每卷篇頁無多勢不可於十卷之中析出七卷而十卷之中補前漢者八卷補後漢者僅二卷多寡亦太相懸殆修宋史時已佚其七卷以不完之本著録歟劉氏之書於舊文多所改正而隨筆標記率不暇剖析其所以然仁傑是書獨引據賅洽考證詳晰元元本本務使明白無疑而後已其淹通實勝於原書雖中間以麟止為麟趾之類間有一二之附會要其大致固瑕一而瑜百者也曽絳序述周必大之言以博物洽間稱之固不虛矣乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
